<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Evento de Mascotas · Museo y Votación</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700&display=swap">
<style>
:root{--bg:#FFF4E0;--card:#FFFFFF;--ink:#1F2A44;--mut:#5B6580;--acc:#D9593F;--line:#E9D9B8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141B2D;--card:#1F2A44;--ink:#FFF4E0;--mut:#AEB7CE;--acc:#F08A72;--line:#33415F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141B2D;--card:#1F2A44;--ink:#FFF4E0;--mut:#AEB7CE;--acc:#F08A72;--line:#33415F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Nunito',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:'Fredoka',system-ui,sans-serif;margin:0;line-height:1.15}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:11;border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header .wrap{padding:0}
header h1{font-size:26px}
nav{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
nav a{padding:8px 16px;border-radius:999px;border:2px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
nav a.on{background:var(--acc);border-color:var(--acc);color:#1F2A44}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;cursor:pointer;color:inherit;font:inherit}
.card:hover{border-color:var(--acc)}
.av{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid var(--acc);display:block;margin:0 auto 8px}
.card h3{font-size:22px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(10,14,25,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.on{display:flex}
.mod{background:var(--card);border-radius:24px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.mod img.big{width:100%;border-radius:14px;margin-top:10px;display:block}
.btn{background:var(--acc);color:#1F2A44;border:0;border-radius:999px;padding:10px 20px;font:700 16px 'Nunito',system-ui,sans-serif;cursor:pointer}
.btn.o{background:none;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:10px 0;flex-wrap:wrap}
.row .av{width:64px;height:64px;margin:0}
.row .info{flex:1;min-width:160px}
.bar{height:12px;border-radius:8px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.wheel{position:relative;width:min(340px,100%);margin:16px auto}
.wheel canvas{width:100%;height:auto;display:block}
.ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:14px solid transparent;border-top:26px solid var(--ink);border-bottom:0}
.note{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;margin:10px 0}
.ctr{text-align:center}
</style></head><body>

{id:'orio',owner:'Minina',pets:'Orio',av:'a1',story:`Orio fue un regalo de una amiga de mi mamá: el último de su camada con vida. Llegó a casa a los cuatro meses, uno de los mejores días de mi vida; siempre había querido un perro.\n\nCasi lo pierdo por una enfermedad mortal. Me volví su enfermera, hasta me lo llevé a la escuela en una caja, y solo cinco días después de empezar el tratamiento volvió a ser el perrito de siempre.\n\nHoy no lo veo solo como una mascota: es mi hijo, al que amo muchísimo. Te amo, Orio.`,imgs:[['i3','Hoja de referencia de Orio'],['i2','Orio y su dueña'],['i4','Orio con su collar rojo']]},
{id:'dora',owner:'Dora',pets:'Kitty y Sam',av:'a2',story:`Kitty: una gatita que mi mamá adoptó de la gata de una tía. Vivió con nosotros hasta que yo tenía 5 años y luego la adoptó un tío. Aún la veo en casa de mi abuela, aunque creo que me guarda rencor.\n\nSam: el gato viejito de mi tío, quien adoptó a Kitty. Falleció a inicios de noviembre por un fallo pulmonar. Cuando yo estaba mal, siempre se pegaba a mi tobillo para que lo acariciara. Sigue presente en cualquier lugar.`,imgs:[['i5','Kitty'],['i6','Sam']]},
{id:'void',owner:'Void',pets:'Sammy, Lilith y Garfield',av:'a3',story:`Sammy fue uno de mis primeros gatos, adoptado por mi cuenta para cuidarlo y educarlo. Dormía conmigo y siempre sabía dónde encontrarme. Hace unos 3 años que partió, y lo sigo recordando con mucho cariño.\n\nHoy cuido a dos gatos que son familia: Lilith, muy tímida, y Garfield, muy chillón y pidiendo atención todo el tiempo. Aunque siempre me peleo con Garfield, los quiero con todo el corazón.`,imgs:[['i7','Sammy'],['i8','Lilith y Garfield']]},
{id:'max',owner:'Adriana',pets:'Max',av:'a4',story:`Max es mi mascota más querida: me lo regaló mi abuelo (que ya no está con nosotros) para mi cumpleaños, siendo un bebé chiquito y muy travieso. Estar a su lado era estar con mi abuelo.\n\nLlegó a tener familia e hijos y estuvo conmigo 5 años. Ya está en el cielo; su historia es corta, pero es la historia de Max.`,imgs:[['i9','Max en brazos de Adriana'],['i10','Max sobre su cojín']]},
{id:'lety',owner:'Lety',pets:'Mi linda gordita',av:'a5',story:`Hace unos años, en secundaria, pasé por uno de los peores momentos de mi vida: me sentía sola y llegué a pensar en hacerme daño.\n\nDe camino a casa había una gata con su gatito; empecé a llevarle comida y, por primera vez en semanas, sentí que tenía un propósito. Un día de lluvia la encontré tirada y corrió hacia mí. Me la llevé a casa: un día se volvió una semana, una semana un mes.\n\nEsta es la historia de cómo un gato me salvó la vida.`,imgs:[['i11','Dibujo de Lety y su gata'],['i12','Mi linda gordita']]}
];
const ART=[['i1','Silla con carita'],['i2','Orio'],['i3','Hoja de Orio'],['i5','Kitty'],['i6','Sam'],['i7','Sammy'],['i8','Lilith y Garfield'],['i9','Max'],['i11','Lety y su gata']];
const COL=['#F6C1B4','#BFE3F7','#FFE08A','#CDEBC5','#D9C7F2'];
const TABS=[['museo','Museo'],['votar','Votar'],['ruleta','Ruleta']];
const $=s=>document.querySelector(s);
let votes={},manual={},tab='museo',rot=0,spinning=false,msg='';
const tot=id=>(votes[id]||0)+(manual[id]||0);
const para=t=>t.split('\n\n').map(x=>`<p>${x}</p>`).join('');
function open(h){$('#mod').innerHTML=h+`<p class="ctr"><button class="btn o" onclick="shut()">Cerrar</button></p>`;$('#ov').classList.add('on')}
function shut(){$('#ov').classList.remove('on')}
$('#ov').onclick=e=>{if(e.target.id==='ov')shut()};
function show(id){const p=P.find(x=>x.id===id);open(`<img class="av" src="${IMG[p.av]}" alt="Foto de ${p.owner}"><h2 class="ctr">${p.owner}</h2><p class="ctr mut">${p.pets}</p>${para(p.story)}${p.imgs.map(i=>`<img class="big" src="${IMG[i[0]]}" alt="${i[1]}">`).join('')}`)}
function pic(k,c){open(`<h3>${c}</h3><img class="big" src="${IMG[k]}" alt="${c}">`)}
function vMuseo(){return `<p class="mut">Queríamos dar a conocer a sus mascotas e integrarlas al servidor de la mejor manera posible. Toca una tarjeta para conocer su historia.</p><div class="grid">${P.map(p=>`<button class="card" onclick="show('${p.id}')"><img class="av" src="${IMG[p.av]}" alt="Foto de ${p.owner}"><h3>${p.owner}</h3><div class="mut">${p.pets}</div></button>`).join('')}</div><h2>✨ Museo de las estrellas</h2><p class="mut">Todos los dibujitos, como un museo de la fama.</p><div class="gal">${ART.map(a=>`<img src="${IMG[a[0]]}" alt="${a[1]}" title="${a[1]}" onclick="pic('${a[0]}','${a[1]}')">`).join('')}</div>`}
const FORM_URL='';
function vVotar(){const sum=P.reduce((a,p)=>a+tot(p.id),0)||1;return `<h2>Votación</h2>${FORM_URL?`<p class="ctr"><a class="btn" href="${FORM_URL}" target="_blank" rel="noopener">Votar ahora</a></p>`:`<p class="mut">Vota en el canal de Discord del evento; aquí se muestra el conteo.</p>`}<h3>Conteo</h3><p class="mut">Suma con + y − los votos que recibas. El conteo se guarda solo en este navegador.</p>${P.map(p=>`<div class="row"><img class="av" src="${IMG[p.av]}" alt="Foto de ${p.owner}"><div class="info"><b>${p.owner}</b> <span class="mut">· ${p.pets}</span><div class="bar"><i style="width:${Math.round(tot(p.id)/sum*100)}%"></i></div><small class="mut">${tot(p.id)} voto${tot(p.id)===1?'':'s'}</small></div><button class="btn o" onclick="adj('${p.id}',-1)">−</button><button class="btn" onclick="adj('${p.id}',1)">+</button></div>`).join('')}`}
function vRuleta(){return `<h2>Ruleta de participantes</h2><div class="wheel"><canvas id="w" width="680" height="680"></canvas><div class="ptr"></div></div><p class="ctr"><button class="btn" id="sp" onclick="spin()">¡Girar!</button></p><div class="ctr" id="res"></div>`}
function draw(){const c=$('#w');if(!c)return;const x=c.getContext('2d'),R=c.width/2,s=2*Math.PI/P.length;x.clearRect(0,0,c.width,c.height);x.save();x.translate(R,R);x.rotate(rot);P.forEach((p,i)=>{x.beginPath();x.moveTo(0,0);x.arc(0,0,R-8,-Math.PI/2+i*s,-Math.PI/2+(i+1)*s);x.closePath();x.fillStyle=COL[i];x.fill();x.strokeStyle='#1F2A44';x.lineWidth=3;x.stroke();x.save();x.rotate(-Math.PI/2+(i+.5)*s);x.fillStyle='#1F2A44';x.font='bold 40px system-ui,sans-serif';x.textAlign='right';x.fillText(p.owner,R-44,14);x.restore()});x.restore()}
function spin(){if(spinning)return;spinning=true;$('#sp').disabled=true;$('#res').innerHTML='';const n=P.length,s=2*Math.PI/n,i=Math.floor(Math.random()*n),start=rot,TP=2*Math.PI;const d=((-(i+.5+(Math.random()-.5)*.6)*s-start)%TP+TP)%TP,end=start+TP*6+d,t0=performance.now(),D=4800;
(function f(t){const k=Math.min(1,(t-t0)/D);rot=start+(end-start)*(1-Math.pow(1-k,3));draw();if(k<1)return requestAnimationFrame(f);spinning=false;const b=$('#sp');if(b)b.disabled=false;const p=P[i];$('#res').innerHTML=`<h2>🎉 ¡Le tocó a ${p.owner}!</h2><p class="mut">${p.pets}</p><button class="btn" onclick="show('${p.id}')">Ver en el museo</button>`})(t0)}
function adj(id,d){manual[id]=Math.max(0,(manual[id]||0)+d);try{localStorage.setItem('conteo',JSON.stringify(manual))}catch(e){}render()}
function render(){$('#nav').innerHTML=TABS.map(t=>`<a href="#${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</a>`).join('');$('#v').innerHTML=tab==='votar'?vVotar():tab==='ruleta'?vRuleta():vMuseo();if(tab==='ruleta')draw()}
function go(){const h=location.hash.slice(1);tab=TABS.some(t=>t[0]===h)?h:'museo';render();scrollTo(0,0)}
addEventListener('hashchange',go);go();
try{manual=JSON.parse(localStorage.getItem('conteo'))||{};render()}catch(e){}
</script></body></html>
